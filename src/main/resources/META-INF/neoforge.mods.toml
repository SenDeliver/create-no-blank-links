modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SenDeliver/create-no-blank-links/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Denys Selivanov"
credits="Built on Create by the Create team (simibubi and contributors)."
displayURL="https://github.com/SenDeliver/create-no-blank-links"
logoFile="no_blank_links_logo.png"
logoBlur=false
description='''Create Redstone Links with no frequency item never carry power.'''
displayTest="IGNORE_ALL_VERSION"
